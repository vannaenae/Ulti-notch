name: CI

on:
  push:
    branches: ["**"]
    paths:
      - "Packages/**"
      - "App/**"
      - "project.yml"
      - ".github/workflows/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  core:
    name: UltiNotchKit build and test
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Test
        working-directory: Packages/UltiNotchKit
        run: swift test --parallel

  app:
    name: App build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Build
        run: |
          xcodebuild -project UltiNotch.xcodeproj -scheme UltiNotch -configuration Release \
            -derivedDataPath build -destination 'platform=macOS' -quiet build
