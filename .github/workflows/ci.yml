name: CI

on:
  push:
    branches: ["**"]
    paths:
      - "Packages/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: UltiNotchKit build and test
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Packages/UltiNotchKit
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test --parallel
