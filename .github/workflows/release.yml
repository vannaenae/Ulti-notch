name: Release

# Push a tag like v0.1.0 to publish a build on GitHub Releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project UltiNotch.xcodeproj -scheme UltiNotch -configuration Release \
            -derivedDataPath build -destination 'platform=macOS' -quiet build
      # ponytail: ad-hoc signed. Add Developer ID signing + notarytool steps once the
      # secrets in ARCHITECTURE §12 exist.
      - name: Package
        run: |
          APP="build/Build/Products/Release/Ulti Notch.app"
          mkdir dmg && cp -R "$APP" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Ulti Notch" -srcfolder dmg -ov -format UDZO "UltiNotch-${GITHUB_REF_NAME}.dmg"
          ditto -c -k --keepParent "$APP" "UltiNotch-${GITHUB_REF_NAME}.zip"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" UltiNotch-*.dmg UltiNotch-*.zip \
            --prerelease --title "Ulti Notch ${GITHUB_REF_NAME}" \
            --notes "Preview build. Not notarised yet: after dragging to Applications, open it once, then go to System Settings → Privacy & Security → Open Anyway."
